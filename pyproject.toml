[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "brandfit-creator-persona-core"
version = "0.1.0"
description = "Evidence-grounded digital creator persona pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<1",
  "langgraph-checkpoint-postgres>=2,<4",
  "minio>=7.2,<8",
  "numpy>=1.26,<3",
  "orjson>=3.10,<4",
  "pgvector>=0.3,<1",
  "pillow>=10,<12",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=17,<22",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "redis>=5,<7",
  "sentence-transformers>=3,<6",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
media = [
  "easyocr>=1.7,<2",
  "faster-whisper>=1.1,<2",
  "opencv-python-headless>=4.10,<5",
]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
brandfit-api = "brandfit_core.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/brandfit_core"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -p no:cacheprovider"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
  "ASYNC240", # Small CLI scripts perform bounded local reads before async DB work.
  "B008",     # FastAPI dependency markers are intentionally function-call defaults.
  "UP046",    # Generic syntax remains compatible with the supported Python range.
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "easyocr.*", "faster_whisper.*", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["brandfit_core.workers.celery_app", "brandfit_core.workers.tasks"]
disallow_untyped_decorators = false
